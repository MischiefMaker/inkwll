# Tries signing up and logging in with a real Firefox and Chromium, and prints
# what each browser does with the cookies and the forms that redirect.
#
# It never touches the live game. It starts a throwaway copy of the game
# inside this run (same production settings, its own empty database with the
# starter map), makes its Probe players there with a new random password,
# and everything is thrown away when the run ends. The scripts live in
# script/probe/ and refuse to run against anything but this local copy.
# Start it by hand (Actions → Probe login → Run workflow).
name: Probe login

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: inkwll
          POSTGRES_PASSWORD: probe-copy-only
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RAILS_ENV: production
      DB_HOST: localhost
      INKWLL_DATABASE_PASSWORD: probe-copy-only
      INKWLL_HTTPS: "false"
      PROBE_URL: http://127.0.0.1:3000

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Make this run's secrets
        run: |
          key=$(openssl rand -hex 64)
          pw="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)Aa1"
          echo "::add-mask::$key"
          echo "::add-mask::$pw"
          echo "SECRET_KEY_BASE=$key" >> "$GITHUB_ENV"
          echo "PROBE_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Start a throwaway copy of the game
        run: |
          bin/rails db:prepare db:seed
          bin/rails assets:precompile
          SOLID_QUEUE_IN_PUMA=true bin/rails server -p 3000 -b 127.0.0.1 > /tmp/game.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "$PROBE_URL/up" >/dev/null && exit 0; sleep 2; done
          echo "The copy of the game didn't start:"; cat /tmp/game.log; exit 1

      - name: Install the browsers
        working-directory: script/probe
        run: |
          npm init -y >/dev/null
          npm i playwright >/dev/null
          npx playwright install --with-deps firefox chromium >/dev/null

      - name: Forms that redirect (Enter and Post thread), in Firefox and Chromium
        working-directory: script/probe
        run: node forms.js

      - name: Sign up and log in
        working-directory: script/probe
        run: node login.js

      - name: Game log, if something failed
        if: failure()
        run: tail -n 200 /tmp/game.log
