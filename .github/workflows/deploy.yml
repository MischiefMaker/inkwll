# Puts the game on the droplet with Kamal. It only runs when started by
# hand (Actions → Deploy → Run workflow), so nothing goes live by accident.
#
# Needs, under Settings → Secrets and variables → Actions:
#   Secrets:   DEPLOY_SSH_KEY, SECRET_KEY_BASE, DATABASE_PASSWORD,
#              WELLS_GITHUB_TOKEN (optional; lets the Founder's Wells page
#              start updates, see docs/wells.md), SMTP_USERNAME and
#              SMTP_PASSWORD (optional; the Brevo login and key that send
#              email, see docs/email-setup.md)
#   Variables: INKWLL_SERVER (the droplet's IP address; a secret works too)
# See docs/deploying.md.
#
# With "well" set it starts or updates another Well (game) on the same
# droplet instead of inkwll.com. That Well's own passwords are made the first
# time and kept on the droplet in /root/wells/<well>.env. See docs/wells.md.
name: Deploy
# The Wells page finds its run by the request id in brackets.
run-name: ${{ inputs.request_id && format('{0} {1} at {2} ({3})', inputs.first_time && 'Start' || 'Update', inputs.well || 'inkwll', inputs.version, inputs.request_id) || 'Deploy' }}

on:
  workflow_dispatch:
    inputs:
      first_time:
        description: "First deploy to a new droplet (runs kamal setup)"
        type: boolean
        default: false
      make_founder:
        description: "Player name to make Founder instead of deploying (leave empty to deploy)"
        type: string
        default: ""
      version:
        description: "Version marked ready to deploy, like v1.0 (leave empty for the latest main)"
        type: string
        default: ""
      request_id:
        description: "Set by the Wells page; leave empty"
        type: string
        default: ""
      well:
        description: "Another Well's short name, like moonfall (leave empty for inkwll.com)"
        type: string
        default: ""
      well_domain:
        description: "That Well's address, like moonfall.inkwll.com"
        type: string
        default: ""
      setup_code:
        description: "Set by the Wells page for a new Well; leave empty"
        type: string
        default: ""
      well_name:
        description: "That Well's name, like Last Call of the Wild"
        type: string
        default: ""

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INKWLL_SERVER: ${{ vars.INKWLL_SERVER || secrets.INKWLL_SERVER }}
      INKWLL_SSH_KEY: /home/runner/.ssh/inkwll-deploy
      # inkwll.com's own secrets. Other Wells read theirs from the droplet.
      SECRET_KEY_BASE: ${{ inputs.well == '' && secrets.SECRET_KEY_BASE || '' }}
      DATABASE_PASSWORD: ${{ inputs.well == '' && secrets.DATABASE_PASSWORD || '' }}
      WELLS_GITHUB_TOKEN: ${{ inputs.well == '' && secrets.WELLS_GITHUB_TOKEN || '' }}
      # Every Well shares the one Brevo account for email.
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      INKWLL_SERVICE: ${{ inputs.well || 'inkwll' }}
      INKWLL_DOMAIN: ${{ inputs.well_domain || 'inkwll.com' }}
      INKWLL_HOME_URL: ${{ inputs.well != '' && 'https://inkwll.com' || '' }}
      INKWLL_GAME_NAME: ${{ inputs.well != '' && inputs.well_name || '' }}
    steps:
      - name: Check the Well's name and address
        if: inputs.well != ''
        env:
          WELL: ${{ inputs.well }}
          SETUP_CODE: ${{ inputs.setup_code }}
        run: |
          if ! [[ "$WELL" =~ ^[a-z][a-z0-9]{1,19}$ ]] || [ "$WELL" = inkwll ]; then echo "::error::A Well's short name is 2 to 20 small letters and numbers, starting with a letter."; exit 1; fi
          if ! [[ "$INKWLL_DOMAIN" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)+$ ]] || [ "$INKWLL_DOMAIN" = inkwll.com ]; then echo "::error::The Well needs its own address, like moonfall.inkwll.com."; exit 1; fi
          if [ -n "$SETUP_CODE" ] && ! [[ "$SETUP_CODE" =~ ^[0-9a-f]{16,64}$ ]]; then echo "::error::The setup code doesn't look right."; exit 1; fi

      - name: Check the version name
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in v[0-9]*) ;; *) echo "::error::Versions look like v1.0."; exit 1;; esac
          case "$VERSION" in *[!A-Za-z0-9.-]*) echo "::error::Versions look like v1.0."; exit 1;; esac

      # The workflow's steps always come from main. A version's commit is
      # looked up in config/versions.yml on main, then the game's code is
      # taken from that commit.
      - uses: actions/checkout@v7

      - name: Find the version's commit
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          commit=$(ruby -rdate -ryaml -e 'v = YAML.safe_load_file("config/versions.yml", permitted_classes: [Date]).find { |e| e["version"] == ENV["VERSION"] }; print v ? v["commit"] : ""')
          case "$commit" in *[!0-9a-f]*|"") echo "::error::$VERSION isn't in config/versions.yml."; exit 1;; esac
          echo "VERSION_COMMIT=$commit" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION_COMMIT || github.ref }}
          fetch-depth: 0

      # A version from before Wells existed would deploy over inkwll.com.
      - name: Check this version can run other Wells
        if: inputs.well != ''
        run: |
          grep -q INKWLL_SERVICE config/deploy.yml || { echo "::error::This version is older than other Wells; pick a newer one."; exit 1; }

      # The game shows this on the Wells page: the version's name, or for a
      # deploy of main, the commit it was.
      - name: Name the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # A deploy of main whose commit is already marked ready gets that
          # version's name too (looked up in config/versions.yml on main).
          if [ -z "$VERSION" ]; then
            git fetch -q --depth=1 origin main
            VERSION=$(git show FETCH_HEAD:config/versions.yml | COMMIT=$(git rev-parse HEAD) ruby -rdate -ryaml -e 'v = YAML.safe_load($stdin.read, permitted_classes: [Date]).to_a.find { |e| e["commit"] == ENV["COMMIT"] }; print v ? v["version"] : ""')
          fi
          echo "INKWLL_VERSION=${VERSION:-$(git rev-parse --short HEAD)}" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Add the droplet's key
        run: |
          if [ -z "$INKWLL_SERVER" ]; then echo "::error::Add the droplet's IP address as INKWLL_SERVER under Settings, Secrets and variables, Actions."; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/inkwll-deploy
          chmod 600 ~/.ssh/inkwll-deploy
          # Trust only the droplet's ed25519 key. With every key type listed,
          # deploys sometimes stopped with a host key mismatch.
          ssh-keyscan -t rsa,ecdsa,ed25519 "$INKWLL_SERVER" > /tmp/host-keys 2>/dev/null
          ssh-keygen -lf /tmp/host-keys | sed "s/$INKWLL_SERVER/droplet/"
          ssh-keyscan -H -t ed25519 "$INKWLL_SERVER" >> ~/.ssh/known_hosts

      # A new Well at a subdomain of inkwll.com gets its address made in
      # DigitalOcean's DNS. A Well at its own domain is pointed by hand.
      - name: Make the Well's address
        if: inputs.well != '' && inputs.first_time && endsWith(inputs.well_domain, '.inkwll.com')
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          if [ -z "$DIGITALOCEAN_TOKEN" ]; then echo "::error::Add the DigitalOcean key as DIGITALOCEAN_TOKEN under Settings, Secrets and variables, Actions."; exit 1; fi
          name="${INKWLL_DOMAIN%.inkwll.com}"
          api="https://api.digitalocean.com/v2/domains/inkwll.com/records"
          existing=$(curl -fsS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" "$api?type=A&name=$INKWLL_DOMAIN" | jq '.domain_records | length')
          if [ "$existing" = 0 ]; then
            curl -fsS -X POST -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" -H "Content-Type: application/json" \
              -d "{\"type\":\"A\",\"name\":\"$name\",\"data\":\"$INKWLL_SERVER\",\"ttl\":1800}" "$api" > /dev/null
            echo "Made $INKWLL_DOMAIN point at the droplet."
          else
            echo "$INKWLL_DOMAIN already has an address."
          fi

      # Another Well's own passwords (and a new Well's setup code), made the
      # first time and kept on the droplet, never in GitHub.
      - name: Get the Well's passwords
        if: inputs.well != ''
        env:
          SETUP_CODE: ${{ inputs.setup_code }}
        run: |
          ssh -i "$INKWLL_SSH_KEY" "root@$INKWLL_SERVER" "WELL=$INKWLL_SERVICE SETUP_CODE=$SETUP_CODE bash -s" > ~/well-secrets.env <<'SECRETS'
          set -euo pipefail
          umask 077
          mkdir -p /root/wells
          file="/root/wells/$WELL.env"
          if [ ! -f "$file" ]; then
            { echo "SECRET_KEY_BASE=$(openssl rand -hex 64)"; echo "DATABASE_PASSWORD=$(openssl rand -hex 24)"; echo "WELL_SETUP_CODE=$SETUP_CODE"; } > "$file"
          fi
          cat "$file"
          SECRETS
          chmod 600 ~/well-secrets.env
          while IFS='=' read -r _ value; do [ -n "$value" ] && echo "::add-mask::$value"; done < ~/well-secrets.env
          echo "INKWLL_SECRETS=$HOME/well-secrets.env" >> "$GITHUB_ENV"

      # A copy of the Well's database on the droplet before anything changes,
      # in /root/backups. The newest ten of each Well are kept.
      - name: Back up the database
        if: inputs.make_founder == '' && !inputs.first_time
        run: |
          ssh -i "$INKWLL_SSH_KEY" "root@$INKWLL_SERVER" "SERVICE=$INKWLL_SERVICE bash -s" <<'BACKUP'
          set -euo pipefail
          mkdir -p /root/backups
          prefix="/root/backups/$([ "$SERVICE" = inkwll ] || echo "$SERVICE-")before-update"
          file="$prefix-$(date -u +%Y%m%d-%H%M%S).sql.gz"
          docker exec "$SERVICE-db" pg_dump -U inkwll inkwll_production | gzip > "$file"
          if [ "$(stat -c %s "$file")" -lt 1000 ]; then echo "The backup came out empty, so nothing was updated."; exit 1; fi
          ls -1t "$prefix"-*.sql.gz | tail -n +11 | xargs -r rm --
          echo "Backed up to $file ($(du -h "$file" | cut -f1))"
          BACKUP

      - uses: docker/setup-buildx-action@v3

      - name: Deploy
        if: inputs.make_founder == ''
        run: bin/kamal ${{ inputs.first_time && 'setup' || 'deploy' }}

      # Gives a registered player Founder powers on the live game.
      - name: Make Founder
        if: inputs.make_founder != ''
        env:
          FOUNDER_NAME: ${{ inputs.make_founder }}
        run: |
          case "$FOUNDER_NAME" in *[!A-Za-z0-9\ _.-]*) echo "Names can only have letters, numbers, spaces, dots, hyphens and underscores."; exit 1;; esac
          bin/kamal app exec --reuse "bin/rails \"inkwll:make_founder[$FOUNDER_NAME]\""
