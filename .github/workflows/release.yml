# Marks a version ready for the Wells page by making a GitHub Release, which
# is what the page lists. Claude runs it (Actions → Mark version ready) once
# a commit has passed the tests and run on inkwll.com, with plain-language
# notes on what changed. See docs/wells.md.
name: Mark version ready
run-name: Mark ${{ inputs.version }} ready

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, like v1.0"
        type: string
        required: true
      commit:
        description: "Commit to mark (leave empty for the latest main)"
        type: string
        default: ""
      notes:
        description: "What changed, in plain words. Say if going back past this version is unsafe."
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit || github.sha }}
          NOTES: ${{ inputs.notes }}
        run: |
          case "$VERSION" in v[0-9]*) ;; *) echo "::error::Versions look like v1.0."; exit 1;; esac
          case "$VERSION" in *[!A-Za-z0-9.-]*) echo "::error::Versions look like v1.0."; exit 1;; esac
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title "$VERSION" --notes-file notes.md
