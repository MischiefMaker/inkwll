# Marks a version ready for the Wells page. Claude pushes a tag like v1.0,
# with the plain-language notes as the tag's message, once that code has
# passed the tests and run on inkwll.com. This turns it into a GitHub
# Release, which is what the Wells page lists. See docs/wells.md.
name: Mark version ready

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > /tmp/notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag
