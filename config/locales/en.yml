# The words players see.
#
# Inkwll's code uses plain words (room, exit, scene, pose, log, area). This
# file decides what players actually read. A game can change any of these
# words here without touching the code.
#
# In a view, use the `term` helper:
#
#     term(:room)            # => "Setting"
#     term(:room, count: 2)  # => "Settings"
#
# YAML reads yes/no/on/off as true/false, so quote those if you ever need them.

en:
  terms:
    area:
      one: "Area"
      other: "Areas"
    room:
      one: "Setting"
      other: "Settings"
    exit:
      one: "Path"
      other: "Paths"
    scene:
      one: "Chapter"
      other: "Chapters"
    pose:
      one: "Passage"
      other: "Passages"
    log:
      one: "Manuscript"
      other: "Manuscripts"
    logs_collection: "Archives"
    # Forum boards for news, advertising, wanted ads and so on.
    forum_board:
      one: "Board"
      other: "Boards"
    forum_topic:
      one: "Thread"
      other: "Threads"
    forum_post:
      one: "Post"
      other: "Posts"
    staff_levels:
      player: "Player"
      page: "Page"
      scribe: "Scribe"
      wellkeeper: "Wellkeeper"
    # How a Chapter can be seen and joined.
    scene_visibility:
      joinable: "Open"
      private: "Private"
      hidden: "Hidden"
    # How turns work in a Chapter.
    pose_modes:
      turns: "Take turns"
      free: "Free-for-all"
      three_pose: "3-Passage rule"
    founder: "Founder"
    storyteller: "Storyteller"
    job_flags:
      build: "Build"
      app: "App"
