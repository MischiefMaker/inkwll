# Versions marked ready for the Founder's Wells page, newest first.
# Claude adds one when a commit on main has passed the tests and run on
# inkwll.com. The notes say what changed in plain words, and whether going
# back past this version is unsafe. See docs/wells.md.
- version: v1.14
  commit: 4eeeb8c84b09202856168471abc28f8bb156faeb
  date: 2026-10-17
  notes: |
    - The sample map gets streets: a street in every small Area, with its buildings and outdoor spaces on it. New games start with them.
    - Updating adds the same streets to a game that still has the sample places (one-off, adds only, never changes or removes anything, does nothing a second time).
    - Going back to v1.13 is safe; the streets stay.
- version: v1.13
  commit: b65251bdae0bde49b8fbffeb10e9500fc39b104c
  date: 2026-10-17
  notes: |
    - Rolls: the ask button label is fixed, a Storyteller can call for a roll with Boons and Banes rulings, and Boons and Banes now default to Player's choice.
    - No database changes; going back to v1.12 is safe.
- version: v1.12
  commit: dba871f58b761f3152897bc6544368c7b80c8b59
  date: 2026-10-17
  notes: |
    - Rolls: players choose which Boons and Banes apply, shown as tick boxes in the roll box and ticked automatically for the chosen Skill.
    - Storyteller rolls: the ask button waits, called-for rolls read correctly, and empty Boons and Banes are noted. A Storyteller can rule which must count and which are optional.
    - A third font box (for big titles) in Admin → Look; the Chapter book icon; switching characters or GM reloads the page so the Passage box can't double up.
    - Adds a few columns to waiting rolls and a title font setting; nothing existing changes. Going back to v1.11 is safe.
- version: v1.11
  commit: 5da0e1437177adf22af9ff5621fc748283a8631b
  date: 2026-10-17
  notes: |
    - Importing a world pack now replaces the game's whole look, so nothing is left over from an earlier skin (such as the old <OOC> chat label).
    - The last three built-in fonts (Great Vibes, Amatic SC, Oswald) are removed; fonts now come only from world packs. Re-import the Last Call of the Wild pack after updating.
    - No database change; going back is safe.
- version: v1.10
  commit: 15feb831c02221159e5d82c4afae79dc0c386720
  date: 2026-10-16
  notes: |
    - "Update every Well" skips any Well (including this game) that is already on that version.
    - No database change; going back is safe.
- version: v1.9
  commit: 42d01ac8f232fb6fda040f11974379e94efa6c50
  date: 2026-10-16
  notes: |
    - Web fonts now travel with each world pack instead of being built into Inkwll, so each game brings its own fonts when a pack is imported.
    - Adds a small table for those fonts; nothing existing changes.
    Going back to v1.8 is safe.

- version: v1.8
  commit: af86c59e238b55d43067625a5ed7a7b32ee45a52
  date: 2026-10-16
  notes: |
    - Starting a new Well has an "I'll import a world pack" box. After you sign up on the new Well you go straight to Import a world.
    - Fonts for Draganic (Cinzel, Cinzel Decorative, Cormorant Garamond).
    - Needs a database change (adds one column on the Wells list); going back past this version is safe.
- version: v1.7
  commit: d88ab9d536c7ef7fbbea2b0733fbd9682fc03ff2
  date: 2026-10-16
  notes: |
    - Admins can delete empty Areas and Places.
    - Import a world: removing unlisted Places moves their characters to The Prologue and their Chapters to The Well of Lost Plots, then deletes them.
    - Wiki bullets that name a character Group take that Group's colour.
    Going back to v1.6 is safe.

- version: v1.6
  commit: 8153c3dbd486241228ff24127d81bf65bf9540f0
  date: 2026-10-16
  notes: |
    - Import a world: "Show me what will change" now goes on to the preview page (it did nothing before).
    Going back to v1.5 is safe.

- version: v1.5
  commit: 7a340601ce9c5bfe385f6c194d02423bd7d999ad
  date: 2026-10-16
  notes: |
    - A new Well's first sign-up link disappears from the Wells page once the Well has a Founder.
    - Import a world for Founders, with bundled web fonts.
    - The Founder's admin front page lists an available update under Needs Attention.
    Going back to v1.4 is safe.

- version: v1.4
  commit: d238acb8949f41d80bf58108c2ff74b072ea9594
  date: 2026-10-16
  notes: |
    - The game is faster: icons are served as shrunk copies, game settings are remembered during each request, and three missing database indexes were added.
    - Boons and Banes no longer have to affect a Skill.
    - Unapproved characters can't start Inklings (other than their Secret and Goal in the application).
    - Inkling entries can be tied to a Chapter.
    - Dead code was removed and one-time clean-ups moved into their migrations.
    Going back to v1.3 is safe.

- version: v1.3
  commit: d016671859966680b78813f083abfb81328a7de9
  date: 2026-10-16
  notes: |
    - The Wells page offers only the newest version for updating; older ones are listed as notes. This game's row says Up-to-Date! or Update available.
    - New Wells: the first sign-up link now makes that player its Founder (it didn't before), and a new Well shows the name you gave it.
    - "Make me its Founder too" when starting a Well opens its sign-up link with your name and email filled in.
    Going back to v1.2 is safe.

- version: v1.2
  commit: dbbed3dc592e3204082205d7ed7d533fc43823da
  date: 2026-10-16
  notes: |
    - The Chapters list is now called Open Chapters and shows only open Chapters, with a note and link to the Archives for finished ones.
    Going back to v1.1 or v1.0 is safe.

- version: v1.1
  commit: f37e0d259843c76089d4fddce555ae17aac698fa
  date: 2026-10-16
  notes: |
    - Start a new Well on this droplet from the Wells page, at an address like moonfall.inkwll.com, with a sign-up link that makes its first player its Founder.
    - Update one Well at a time, or every Well in turn.
    - A box at the top of the Wells page while an update runs.
    - Brings back the nicer All Chapters styling and the front page Chapters link, which going to v1.0 had taken off.
    Going back to v1.0 is safe, but v1.0 can't manage other Wells.

- version: v1.0
  commit: 1f652e8b9fcaa0218a3ff47658f586974ee1fb40
  date: 2026-10-16
  notes: |
    The first marked version of Inkwll: what went live on inkwll.com on 16 October 2026. Updates after this are numbered v1.1, v1.2 and so on.

    - The Founder's Wells page, with Update and Go back buttons.
    - A database backup before every deploy.
    - The testing tweaks: OOC Chat moderation, starter SOUL content, the alerts bell fix, the Chapter page tidy-up, Directory tabs, Chapter numbers, the All Chapters list and GM rolls.
    - The Inkwll version in small text at the bottom of every page.
