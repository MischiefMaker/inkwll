# How Kamal puts Inkwll on the DigitalOcean droplet. See docs/deploying.md.
#
# Nothing secret goes in this file. Passwords and keys are read by
# .kamal/secrets from the deploy folder in the project files.

service: inkwll
image: inkwll

# The droplet's IP address.
servers:
  web:
    - <%= ENV.fetch("INKWLL_SERVER", "DROPLET_IP_GOES_HERE") %>

# Until the game has a domain name, kamal-proxy answers on the IP address
# over plain http. With a domain: add `host: play.example.com` and
# `ssl: true` here, set APP_HOST below, and remove INKWLL_HTTPS.
proxy:
  app_port: 80
  healthcheck:
    path: /up

# Images are built here and pushed to the droplet through a local registry,
# so no Docker Hub account is needed.
registry:
  server: localhost:5555

ssh:
  user: root
  keys_only: true
  keys:
    - <%= ENV.fetch("INKWLL_SSH_KEY", "/mnt/project-files/deploy/inkwll-deploy") %>

env:
  secret:
    - SECRET_KEY_BASE
    - INKWLL_DATABASE_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: inkwll-db
    INKWLL_HTTPS: "false"
    # Fewer threads and one process suit the 1 GB droplet.
    RAILS_MAX_THREADS: 3
    WEB_CONCURRENCY: 1

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Uploaded images live in this volume, so they survive new deploys.
volumes:
  - "inkwll_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

# PostgreSQL runs on the same droplet, only reachable from the app.
accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("INKWLL_SERVER", "DROPLET_IP_GOES_HERE") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: inkwll
        POSTGRES_DB: inkwll_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
