# How Kamal puts Inkwll on the DigitalOcean droplet. See docs/deploying.md.
#
# Nothing secret goes in this file. Passwords and keys are read by
# .kamal/secrets from the deploy folder in the project files.

# Each Well (game) on a droplet is its own Kamal service with its own
# database and uploads. inkwll.com is "inkwll"; the Deploy workflow sets
# INKWLL_SERVICE for other Wells. See docs/wells.md.
<% require "json" %>
<% service = ENV.fetch("INKWLL_SERVICE", "inkwll") %>
service: <%= service %>
image: <%= service %>

# The droplet's IP address.
servers:
  web:
    - <%= ENV.fetch("INKWLL_SERVER", "DROPLET_IP_GOES_HERE") %>

# The 1 GB droplet starts a new copy of the game slowly, so give it two
# minutes to pass its health check instead of the default 30 seconds.
deploy_timeout: 120

# kamal-proxy answers for the game's domain (and its www. version, except
# for subdomains like moonfall.inkwll.com) and gets free HTTPS certificates
# for them from Let's Encrypt. The domain's DNS must already point at the
# droplet when this deploys, or the certificates fail. Plain http visits are
# sent on to https. One kamal-proxy serves every Well on the droplet.
<% domain = ENV.fetch("INKWLL_DOMAIN", "inkwll.com") %>
proxy:
  ssl: true
  hosts:
    - <%= domain %>
<% if domain.count(".") == 1 %>
    - www.<%= domain %>
<% end %>
  app_port: 80
  healthcheck:
    path: /up

# Images are built here and pushed to the droplet through a local registry,
# so no Docker Hub account is needed.
registry:
  server: localhost:5555

ssh:
  user: root
  keys_only: true
  keys:
    - <%= ENV.fetch("INKWLL_SSH_KEY", "/mnt/project-files/deploy/inkwll-deploy") %>

env:
  secret:
    - SECRET_KEY_BASE
    - INKWLL_DATABASE_PASSWORD
    # Lets the Founder's Wells page start updates (see docs/wells.md). Empty
    # until it's set up, which just hides the Update buttons.
    - WELLS_GITHUB_TOKEN
    # A new Well's setup code: the first sign-up link makes its first player
    # the Founder (see docs/wells.md). Empty for inkwll.com.
    - WELL_SETUP_CODE
  clear:
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: <%= service %>-db
    # The game's domain: links in emails use it, and www. visits are sent
    # on to it.
    APP_HOST: <%= domain %>
    # The name given to a Well other than inkwll.com when it was started.
    INKWLL_GAME_NAME: <%= ENV.fetch("INKWLL_GAME_NAME", "").to_json %>
    # Set for Wells other than inkwll.com: where their updates are done from.
    INKWLL_HOME_URL: "<%= ENV.fetch("INKWLL_HOME_URL", "") %>"
    # Fewer threads and one process suit the 1 GB droplet.
    RAILS_MAX_THREADS: 3
    # Which version this is, shown on the Wells page. Set by the Deploy workflow.
    INKWLL_VERSION: "<%= ENV.fetch("INKWLL_VERSION", "") %>"
    WEB_CONCURRENCY: 1

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Uploaded images live in this volume, so they survive new deploys.
volumes:
  - "<%= service %>_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

# PostgreSQL runs on the same droplet, only reachable from the app.
accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("INKWLL_SERVER", "DROPLET_IP_GOES_HERE") %>
<% if service == "inkwll" %>
    port: "127.0.0.1:5432:5432"
<% end %>
    env:
      clear:
        POSTGRES_USER: inkwll
        POSTGRES_DB: inkwll_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
