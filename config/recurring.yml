production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  finish_abandoned_chapters:
    class: AutoFinishJob
    schedule: every day at 4am
  update_vpn_list:
    class: VpnListJob
    schedule: every day at 3am
  email_digests:
    class: DigestJob
    schedule: every day at 5pm
  roster_idle:
    class: RosterIdleJob
    schedule: every day at 4:30am
  alert_cleanup:
    class: AlertCleanupJob
    schedule: every day at 4:45am
  weekly_xp:
    class: WeeklyXpJob
    schedule: every sunday at midnight
  economy_payments:
    class: EconomyDailyJob
    schedule: every day at 1am
  economy_allowance:
    class: EconomyAllowanceJob
    schedule: every sunday at 12:15am
  domain_income:
    class: DomainIncomeJob
    schedule: "0 2 1 * *"
