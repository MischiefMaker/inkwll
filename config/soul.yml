# SOUL's numbers: how rolls, starting points and XP costs work.
#
# Aspects and Skills themselves are set in the admin panel (Admin → SOUL).
# These numbers follow the defaults of the SOUL plugin for AresMUSH
# (github.com/MischiefMaker/ares-soul-plugin). A game can change them here;
# the server needs a restart afterwards.

shared:
  ratings:
    skill_max: 10
    aspect_max: 10

  # How much an Aspect adds to rolls: its rating times this, rounded.
  # Mind 5 adds 1 to every Mind Skill.
  aspect_weight: 0.2

  # Resonance: a character's connection to the world. Higher starts with
  # more Skill points and a higher starting cap, but advancing costs more.
  resonance:
    enabled: true
    min: -3
    max: 3
    skill_points: 15         # at Resonance 0
    skill_points_per_level: 2
    starting_cap: 7          # highest starting Skill at Resonance 0
    starting_cap_per_level: 1
    aspect_points: 5
    aspect_points_per_level: 0

  xp:
    weekly_award: 1          # to every approved character, each Sunday
    scene_award: 1           # to each approved character who posted in a finished Chapter
    bounty_award: 1          # extra, for writing with someone on the weekly scene bounty (0 switches it off)
    cost:
      skill_curve_numerator: 1
      skill_curve_denominator: 2
      skill_cost_multiplier: 1
      aspect_cost_multiplier: 4
      development_base: 1
      development_scale: 250
      development_exponent: 1.25
      negative_resonance_rate: 0.12
      positive_resonance_rate: 0.22
      positive_resonance_surcharge: 1
    # Characters behind the median earn extra on automatic awards until
    # they catch up.
    catchup:
      enabled: true
      multiplier: 2.0

  rolls:
    difficulties:
      trivial: 11
      easy: 12
      standard: 13
      difficult: 17
      hard: 21
      extreme: 25
      legendary: 34
      mythic: 40
    # The margin (result minus difficulty) needed for each degree.
    degrees:
      exceptional_success: 10
      success: 0
      complicated_success: -5
      lucky_failure: -10
      failure: -20
    # A result with less than this chance counts as extraordinary.
    extraordinary_below: 0.0001
    # Players can ask the Chapter's Storyteller to set the difficulty and
    # decide which Boons and Banes count.
    storyteller_rolls: true

  # Boons and Banes: qualities, possessions, connections or troubles that
  # change rolls of the Skills they're tied to. A Boon rerolls low dice, a
  # Bane rerolls high ones; the level says how many faces.
  bnb:
    levels:
      minor: 1
      major: 2
      legendary: 3
    # A character needs one Bane for every this many Boons, always.
    boons_per_bane: 2
    # The most Boons and Banes a starting sheet can have, by Resonance.
    # "max" is the total; "major" and "legendary" cap those levels.
    # Leave max empty for no limit.
    starting_limits:
      "-3": { boons: { max: 0, major: 0, legendary: 0 }, banes: { max: , major: 3, legendary: 3 } }
      "-2": { boons: { max: 0, major: 0, legendary: 0 }, banes: { max: , major: 2, legendary: 2 } }
      "-1": { boons: { max: 1, major: 0, legendary: 0 }, banes: { max: , major: 2, legendary: 1 } }
      "0":  { boons: { max: 2, major: 1, legendary: 0 }, banes: { max: , major: 1, legendary: 0 } }
      "1":  { boons: { max: 3, major: 2, legendary: 0 }, banes: { max: , major: 2, legendary: 1 } }
      "2":  { boons: { max: 3, major: 3, legendary: 1 }, banes: { max: , major: 3, legendary: 2 } }
      "3":  { boons: { max: 4, major: 3, legendary: 2 }, banes: { max: , major: 3, legendary: 3 } }
